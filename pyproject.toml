[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tidal-blade-test-analysis"
version = "0.1.0"
description = "TDMS, fatigue, static, natural-frequency, actuator/RBM, and applied-AI screening utilities for full-scale tidal blade structural test data."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Sergio Lopez-Dubon"}
]
keywords = [
  "tdms",
  "tidal-blades",
  "structural-testing",
  "fatigue",
  "natural-frequency",
  "scientific-python",
  "fastblade",
  "loadtide",
  "applied-ai",
  "anomaly-detection",
  "sensor-qaqc"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering"
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "nptdms>=1.7",
  "scipy>=1.10",
  "scikit-image>=0.21",
  "scikit-learn>=1.3",
  "PyWavelets>=1.5",
  "openpyxl>=3.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5"
]

[project.scripts]
tidal-blade-test = "tidal_blade_test_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
